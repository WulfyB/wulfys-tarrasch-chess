name: Wolf Eval

on:
  push:
    branches: [wolf-eval, wulfys-tarrasch]
    paths: ['wolf-eval/**', 'src/thc.*', '.github/workflows/wolf-eval.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S wolf-eval -B wolf-eval/build -A x64

      - name: Build
        run: cmake --build wolf-eval/build --config Release

      - name: Unit tests
        run: wolf-eval/build/Release/wolf-tests.exe

      - name: Lichess cross-check
        run: python wolf-eval/tests/lichess_reference.py wolf-eval/build/Release/wolf-tests.exe 300

      - name: Smoke test with a real Stockfish
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = gh release view -R official-stockfish/Stockfish --json assets --jq '.assets[].name'
          $assets
          $pick = ($assets | Where-Object { $_ -match 'windows' -and $_ -match 'x86-64' } | Select-Object -First 1)
          if (-not $pick) { $pick = ($assets | Where-Object { $_ -match 'windows' } | Select-Object -First 1) }
          "Using $pick"
          gh release download -R official-stockfish/Stockfish --pattern $pick -D sfdl
          $file = Get-ChildItem sfdl | Select-Object -First 1
          if ($file.Extension -eq '.zip') { Expand-Archive $file.FullName -DestinationPath sf } else { New-Item -ItemType Directory sf | Out-Null; Copy-Item $file.FullName sf/ }
          $exe = Get-ChildItem sf -Recurse -Filter *.exe | Select-Object -First 1
          wolf-eval/build/Release/wolf-eval.exe --engine $exe.FullName --depth 16 wolf-eval/tests/games/opera.pgn
          # Wulfy's sample game: today's Stockfish should mark 15...Nc3+, 23.Nc4, 30.Rd5 and 31.Qxc8+ as
          # Brilliant and few or no Greats (shown for a human to check; engine versions differ a little)
          wolf-eval/build/Release/wolf-eval.exe --engine $exe.FullName --depth 18 --threads 2 wolf-eval/tests/games/wulfy-sample-1.pgn | Select-String -Pattern '!|Brilliant [0-9]'

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item wolf-eval/build/Release/wolf-eval.exe out/
          Copy-Item wolf-eval/README.md out/
          Copy-Item wolf-eval/tests/games/opera.pgn out/

      - uses: actions/upload-artifact@v4
        with:
          name: wolf-eval-windows
          path: out/

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S wolf-eval -B wolf-eval/build -DCMAKE_BUILD_TYPE=Release && cmake --build wolf-eval/build -j
      - run: wolf-eval/build/wolf-tests
      - run: python3 wolf-eval/tests/lichess_reference.py wolf-eval/build/wolf-tests 300
